name: Build and Scan

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      run: |
        pyinstaller ^
          --onefile ^
          --noconsole ^
          --name "LastPassMngr" ^
          --icon "Logo.ico" ^
          --add-data "Logo.ico;." ^
          --hidden-import password_generator ^
          --hidden-import crypto_manager ^
          --hidden-import save_dialog ^
          --hidden-import manager_window ^
          --hidden-import master_password_dialog ^
          app.py
      env:
        PYTHONIOENCODING: utf-8

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LastPassMngr
        path: dist/LastPassMngr.exe

    - name: VirusTotal Scan
      if: success()
      uses: crazy-max/ghaction-virustotal@v4.0.0
      with:
        vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
        files: dist/LastPassMngr.exe
